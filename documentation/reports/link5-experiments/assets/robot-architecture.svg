 poses → world pointmaps</text><rect x="385" y="395" width="315" height="115" rx="6" fill="#f0f4f8" stroke="#ced9e2"/><text x="542.5" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Frame-zero point queries</text><text x="542.5" y="446" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">SIFT + Shi–Tomasi + grid</text><text x="542.5" y="467" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Spatially balanced queries</text><text x="542.5" y="488" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Stable point IDs</text><rect x="385" y="560" width="315" height="95" rx="6" fill="#f0f4f8" stroke="#ced9e2"/><text x="542.5" y="587" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">CoTracker3 exact-group</text><text x="542.5" y="611" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">2D trajectories + visibility</text><text x="542.5" y="632" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Link5: frozen queries, raw tracks</text><rect x="385" y="700" width="315" height="70" rx="6" fill="#eaf3fc" stroke="#90b6d6"/><text x="542.5" y="727" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Lift tracks to world XYZ</text><text x="542.5" y="751" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Sample geometry at tracked pixels</text><rect x="740" y="395" width="315" height="115" rx="6" fill="#efe9f8" stroke="#7955a3"/><text x="897.5" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Link5 all-frame depth support</text><rect x="740" y="395" width="5" height="115" rx="2" fill="#7955a3"/><text x="749" y="387" font-family="system-ui,sans-seri