<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="890" viewBox="0 0 1080 890" role="img" aria-labelledby="title"><title id="title">Link7 persistent masking and reseeding</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#667c8c"/></marker></defs><rect width="1080" height="890" fill="#fbfcfd"/><path d="M540.0,90 V117.5 H540.0 V145" fill="none" stroke="#667c8c" stroke-width="2" marker-end="url(#arrow)"/><path d="M540.0,240 V267.5 H540.0 V295" fill="none" stroke="#667c8c" stroke-width="2" marker-end="url(#arrow)"/><path d="M540.0,370 V397.5 H540.0 V425" fill="none" stroke="#667c8c" stroke-width="2" marker-end="url(#arrow)"/><text x="540.0" y="390.5" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#415b6c" paint-order="stroke" stroke="#fbfcfd" stroke-width="7">Confirmed deformation</text><path d="M540.0,525 V555.0 H540.0 V585" fill="none" stroke="#667c8c" stroke-width="2" marker-end="url(#arrow)"/><path d="M540.0,660 V687.5 H540.0 V715" fill="none" stroke="#667c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="15" width="420" height="75" rx="6" fill="#f0f4f8" stroke="#ced9e2"/><text x="540.0" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Frame-zero SAM3 initialization</text><text x="540.0" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">DINOv2 gripper box; follow selected ID</text><rect x="330" y="145" width="420" height="95" rx="6" fill="#f0f4f8" stroke="#ced9e2"/><text x="540.0" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Nominate VLM1 candidate frames</text><text x="540.0" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Upward log-area surge ≥0.25</text><text x="540.0" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Review event−4 through event+5</text><text x="540.0" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">No surge: 30%, 48%, 52%, 60%, 70%</text><rect x="330" y="295" width="420" height="75" rx="6" fill="#eaf3fc" stroke="#90b6d6"/><text x="540.0" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">VLM1 diagnoses palm deformation</text><text x="540.0" y="346" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Compare candidate RGB crops to reference</text><rect x="330" y="425" width="420" height="100" rx="6" fill="#efe9f8" stroke="#7955a3"/><text x="540.0" y="452" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">VLM2 at earliest confirmed frame + 1</text><rect x="330" y="425" width="5" height="100" rx="2" fill="#7955a3"/><text x="339" y="417" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#68418f">REFINED</text><text x="540.0" y="476" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">3 gripper positives; 2 arm/wrist negatives</text><text x="540.0" y="497" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Retries use the same selected frame</text><text x="540.0" y="518" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Invalid required points stop correction</text><rect x="330" y="585" width="420" height="75" rx="6" fill="#efe9f8" stroke="#7955a3"/><text x="540.0" y="612" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Fresh bidirectional SAM3</text><rect x="330" y="585" width="5" height="75" rx="2" fill="#7955a3"/><text x="339" y="577" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#68418f">REFINED</text><text x="540.0" y="636" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Validate frame lineage, point roles, masks</text><rect x="330" y="715" width="420" height="130" rx="6" fill="#efe9f8" stroke="#7955a3"/><text x="540.0" y="742" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Optional object-aware VLM3</text><rect x="330" y="715" width="5" height="130" rx="2" fill="#7955a3"/><text x="339" y="707" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#68418f">REFINED</text><text x="540.0" y="766" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Requires task-object masks</text><text x="540.0" y="787" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">&gt;95% object overlap OR ≥25% image area</text><text x="540.0" y="808" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">3 positives + 3 negatives at exact gate frame</text><text x="540.0" y="829" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Accepted mask feeds both downstream paths</text></svg>