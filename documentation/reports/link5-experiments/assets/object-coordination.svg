ily="system-ui,sans-serif" font-size="14" fill="#435c6d">Allowed crop-frame exclusions</text><rect x="30" y="750" width="260" height="95" rx="6" fill="#fceeea" stroke="#d8a594"/><text x="160.0" y="777" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Required repair fails</text><text x="160.0" y="801" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Exhausted coordinator budget</text><text x="160.0" y="822" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Disable case; save evidence</text><rect x="30" y="910" width="440" height="100" rx="6" fill="#f0f4f8" stroke="#ced9e2"/><text x="250.0" y="937" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Robot branch</text><text x="250.0" y="961" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Selected Link7 + shared MegaSAM</text><text x="250.0" y="982" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Point initialization → CoTracker</text><text x="250.0" y="1003" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">V1 anchors → fixed pairs → rigidity</text><rect x="600" y="910" width="440" height="100" rx="6" fill="#e7f3ed" stroke="#89b9a5"/><text x="820.0" y="937" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Object occlusion branch</text><text x="820.0" y="961" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Object masks + selected Link7 mask</text><text x="820.0" y="982" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Object CoTracker tracks + visibility</text><text x="820.0" y="1003" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Expected silhouette + temporal loss flags</text><rect x="30" y="1080" width="440" height="75" rx="6" fill="#f0f4f8" stroke="#ced9e2"/><text x="250.0" y="1107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Robot score and interactive replay</text><text x="250.0" y="1131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Unavailable measurements remain explicit</text><rect x="600" y="1070" width="440" height="120" rx="6" fill="#e7f3ed" stroke="#89b9a5"/><text x="820.0" y="1097" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">Available pixels → reference mapping</text><text x="820.0" y="1121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">A(t) = object(t) AND NOT Link7(t)</text><text x="820.0" y="1142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Crop gates + eligible recovery successors</text><text x="820.0" y="1163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Ten pairs; quotas 0 / 2 / 2 / 2 / 4</text><text x="820.0" y="1184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Earlier-interval fallback; shared canvases</text><rect x="600" y="1250" width="440" height="95" rx="6" fill="#eaf3fc" stroke="#90b6d6"/><text x="820.0" y="1277" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#172b3b">AnomalyDINO + crop / occlusion replays</text><text x="820.0" y="1301" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Identical selected pair PNGs feed scorer</text><text x="820.0" y="1322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#435c6d">Object geometry is a separate experiment</text></svg>